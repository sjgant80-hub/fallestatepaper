<style>

*{margin:0;padding:0;box-sizing:border-box}

textarea{resize:vertical;min-height:80px;font-family:var(--mono);font-size:12px;line-height:1.5}
a{color:var(--brass)}a:hover{color:var(--amber)}

.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--ox),var(--ox-2));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--cream)}

.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}

nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}
nav.tabs button{padding:0 16px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}
nav.tabs button:hover{background:var(--ink);color:var(--cream)}
nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}

.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}
.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}

.tool-btn.primary{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.tool-btn.primary:hover{background:var(--amber);border-color:var(--amber)}

main{padding:18px 22px 60px;overflow-y:auto;max-width:1320px;margin:0 auto;width:100%}

.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--cream)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%}
.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}

.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent;letter-spacing:0.04em;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.primary{background:var(--ox);color:var(--cream);border-color:var(--ox);font-weight:600}
.btn.primary:hover{background:var(--ox-2);border-color:var(--ox-2)}
.btn.brass{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}
.btn.brass:hover{background:var(--amber);border-color:var(--amber);color:var(--void)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{border-color:var(--line);color:var(--cream-dim)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left}

.tag{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass);margin-right:4px}

.tag.amber{border-color:var(--amber);color:var(--amber)}
.tag.red{border-color:var(--red);color:var(--red)}
.tag.blue{border-color:var(--blue);color:var(--blue)}

.paper table{font-family:var(--sans);font-size:12px;color:var(--paper-ink);margin:10px 0}

.tpl-list{display:flex;flex-direction:column;gap:5px}
.tpl-row{padding:9px 12px;border:1px solid var(--line);border-radius:3px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--void-2)}

.section-edit{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:8px}

.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:40px 22px;text-align:center;border:1px dashed var(--line);border-radius:4px;color:var(--cream-dim)}
.empty h3{font-family:var(--serif);font-size:16px;color:var(--cream);margin-bottom:8px}
.empty p{font-size:12px;margin:6px 0}

.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-family:var(--mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase}

.pill.issued{background:rgba(184,151,74,0.2);color:var(--brass);border:1px solid var(--brass)}
.pill.signed{background:rgba(74,222,128,0.15);color:var(--green);border:1px solid var(--green)}
.pill.served{background:rgba(96,165,250,0.15);color:var(--blue);border:1px solid var(--blue)}

.req-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.req-list .req{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:11px;letter-spacing:0.05em;text-transform:uppercase}
.req-list .req.ok{background:rgba(74,222,128,0.15);color:var(--green)}
.req-list .req.miss{background:rgba(239,68,68,0.15);color:var(--red)}

.preflight{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:12px}
.preflight.pass{border-color:var(--green);border-left:3px solid var(--green)}
.preflight.fail{border-color:var(--red);border-left:3px solid var(--red)}
.preflight h4{font-family:var(--serif);font-size:13px;margin-bottom:8px}
.preflight .chk{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line-soft);font-size:12px}
.preflight .chk:last-child{border-bottom:none}
.preflight .chk .ok{color:var(--green);font-family:var(--mono);font-size:10px}
.preflight .chk .miss{color:var(--red);font-family:var(--mono);font-size:10px}

@media (max-width:760px){nav.tabs button{padding:0 11px;font-size:11px}main{padding:14px 14px 50px}.row,.row-3{grid-template-columns:1fr}}
</style>

  const MODALITIES = ['text', 'image', 'video', 'tts', 'stt'];
  const emptyKeys = () => ({ text: {}, image: {}, video: {}, tts: {}, stt: {} });
  /**
   * What a stored config holds, split into what may be stored (the tier, providers, models) and what is held in this
   * tab only (the keys). Keys stay stored only when the owner chose "remember my keys on this device"; a config written
   * the old way (keys stored, no choice made) has its keys moved into the tab and stored no longer. Pure.
   * → { config, secrets, moved } (moved: how many keys were taken out of storage)
   */
  function configFrom(c) {
    c = c && typeof c === 'object' && !Array.isArray(c) ? Object.assign({}, c) : {};
    if (c.api_key && !c.keys) {   // v1 → v2: one text key at the top level
      c.keys = emptyKeys();
      c.keys.text[c.api_provider || 'anthropic'] = { key: c.api_key, model: c.api_model };
    }
    delete c.api_key;
    const secrets = emptyKeys(), models = emptyKeys();
    let moved = 0;
    for (const m of MODALITIES) {

      for (const pk of Object.keys(held)) {
        const e = held[pk] || {};
        if (typeof e.key === 'string' && e.key) { secrets[m][pk] = e.key; moved++; }
        if (typeof e.model === 'string' && e.model) models[m][pk] = e.model;
      }
      const kept = c.models && c.models[m] && typeof c.models[m] === 'object' ? c.models[m] : {};
      for (const pk of Object.keys(kept)) if (typeof kept[pk] === 'string' && kept[pk]) models[m][pk] = models[m][pk] || kept[pk];
    }
    c.models = models;
    const remember = c.remember_keys === true;
    if (!remember) delete c.keys;
    return { config: c, secrets: secrets, moved: remember ? 0 : moved };

  /** what is written to storage: the config, with the keys only if the owner chose to remember them. Pure. */
  function storedForm(config, secrets) {
    const out = Object.assign({}, config);
    delete out.keys;
    if (config.remember_keys === true) {
      out.keys = emptyKeys();
      for (const m of MODALITIES) for (const pk of Object.keys(secrets[m] || {})) out.keys[m][pk] = { key: secrets[m][pk], model: (config.models && config.models[m] && config.models[m][pk]) || undefined };
    }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();

  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};

  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);

  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });

      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  const MESH_MODULE = '/fall-kit/core/mesh.mjs', MESH_DEVICE = '/fall-kit/core/mesh-device.mjs';
  // v3.2: the LIGHT mesh, loaded from this origin when the mesh is switched on. null = JSON, as before v3.2.
  async function lightMesh() {
    try {
      const [M, D] = await Promise.all([import(MESH_MODULE), import(MESH_DEVICE)]);
      const dev = await D.openDevice();
      const tab = crypto.getRandomValues(new Uint32Array(1))[0];
      return { M, dev, tab, seq: 0, last: new Map() };
    } catch (e) { return null; }
  }
  function meshSend(value) {
    const L = STATE.mesh.light, bc = STATE.mesh.bc;
    if (!L) { bc.postMessage(value); STATE.mesh.stats.sent++; return; }
    L.seq += 1;
    L.M.speak(value, { slot: L.dev.slot, tab: L.tab, seq: L.seq, sign: L.dev.sign }).then((r) => { if (r.ok && STATE.mesh.bc) { STATE.mesh.bc.postMessage(r.bytes); STATE.mesh.stats.sent++; } });
  }
  async function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.active = true;
    STATE.mesh.light = opts.light === false ? null : await lightMesh();
    const st = STATE.mesh.stats;
    STATE.mesh.bc.onmessage = async (e) => {
      const L = STATE.mesh.light;
      if (!L) {
        const m = e.data;
        if (!m || !m.kind || m.peerId === seedId) return;
        if (opts.onMessage) opts.onMessage(m);
        return;
      }
      const r = await L.M.hearMesh(e.data, { slot: L.dev.slot, id: L.dev.id, raw: L.dev.raw, verifyBytes: L.dev.verifyBytes, last: L.last });
      if (!r.ok) { st.refused[r.stage] = (st.refused[r.stage] || 0) + 1; return; }
      if (r.legacy) st.legacy++; else st.admitted++;
      if (r.value.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(Object.assign({}, r.value, r.legacy ? { legacy: true } : { light: true, tab: r.tab }));
    };
    meshSend({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    notify('Mesh active · channel ' + MESH_CHANNEL + (STATE.mesh.light ? ' · LIGHT' : ''), 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    meshSend({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }
  function meshStats() {
    const s = STATE.mesh.stats;
    return { active: STATE.mesh.active, light: !!STATE.mesh.light, tab: STATE.mesh.light ? STATE.mesh.light.tab : null, sent: s.sent, admitted: s.admitted, legacy: s.legacy, refused: Object.assign({}, s.refused) };
  }

  // ─── CSS for AI chip ────────────────────────────────────────────────
  function injectCss() {
    if (STATE.cssIn) return;   // the kit knows it added its styles; no lookup of an id the build's own page never has
    STATE.cssIn = true;
    const s = document.createElement('style');
    s.id = 'fk-css';
    s.textContent = `
      #fk-ai-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:3px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; cursor:pointer; border:1px solid #3a342c; background:#1a1922; color:#a89e88; user-select:none; vertical-align:middle }
      #fk-ai-chip:hover { border-color:#c08a3a; color:#ebe3d2 }
      #fk-ai-chip.fk-chip-live { border-color:#6b8d4a; color:#6b8d4a; background:rgba(107,141,74,.10) }
      #fk-ai-chip.fk-chip-loading { border-color:#e8a83a; color:#e8a83a; background:rgba(232,168,58,.10) }

      .fk-ai-assist:hover { background:#c08a3a; color:#0a0a0a }
      .fk-ai-assist::before { content:'✦'; font-size:12px }
    `;
    document.head.appendChild(s);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';
    }
  }

  // ─── Init ───────────────────────────────────────────────────────────
  function init(opts) {
    opts = opts || {};
    injectCss();
    if (opts.seedName) STATE.config.seedName = opts.seedName;
    if ($('#fk-ai-chip')) { renderAiChip(); return { version: FALL_KIT_VERSION, mounted: false }; }
    const chip = document.createElement('button');
    chip.id = 'fk-ai-chip';
    chip.title = 'AI helper · ask about this page, or pick the brain';
    chip.innerHTML = '<span class="fk-dot"></span><span id="fk-ai-chip-text">T0 · off</span>';
    chip.onclick = () => openSettings();
    const anchor = opts.chipAnchor ? $(opts.chipAnchor) : null;
    if (anchor) { anchor.appendChild(chip); chip.dataset.anchored = '1'; }
    else {
      chip.style.cssText += ';position:fixed;bottom:14px;left:14px;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      document.body.appendChild(chip);
      const place = () => placeChip(chip);
      setTimeout(place, 0); setTimeout(place, 1200);   // once now, once after the build has laid itself out
      let t = null; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(place, 200); });
    }
    renderAiChip();
    if (BOOT.moved) notify('AI keys are now held in this tab only · tick “remember” in AI settings to keep them', 'info');
    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ─────────────────────────────────────────────────────
  root.FallKit = {
    version: FALL_KIT_VERSION,
    init: init,
    aiTier: aiTier,
    aiComplete: aiComplete,
    aiChat: aiChat,
    askPage: askPage,

    requestOf: requestOf,
    textOf: textOf,
    usageOf: usageOf,
    configFrom: configFrom,
    storedForm: storedForm,
    aiImage: aiImage,
    aiVideo: aiVideo,

    aiSTT: aiSTT,

    openSettings: openSettings,

    TEXT_PROVIDERS: TEXT_PROVIDERS,

    VIDEO_PROVIDERS: VIDEO_PROVIDERS,
    TTS_PROVIDERS: TTS_PROVIDERS,
    STT_PROVIDERS: STT_PROVIDERS,
    state: STATE,
  };

let state={active:'templates',firm:null,clients:[],documents:[],audit:[],
  ui:{selectedTemplate:null,selectedClient:null,editingSections:{},extraContext:'',chat:[]},
  settings:{anthropicKey:'',auditChain:true,autoBroadcast:true}};

const $=(s,p=document)=>p.querySelector(s);const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);
const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moneyP=n=>'£'+(+n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','clients','firms','documents'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}

async function loadAll(){if(!db)await openDB();const[firms,clients,docs,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('clients'),idbGetAll('documents'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.clients=clients;state.documents=docs;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{});}}
async function persistUI(){if(!db)await openDB();await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
async function auditLog(action,opts={}){if(!state.settings.auditChain)return;const prev=state.audit.length?state.audit[state.audit.length-1]:null;const prevHash=prev?prev.docHash:'';const i=(prev?prev.i:0)+1;const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash,docHash:'',payload:opts.payload||{}};entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,prevHash,payload:entry.payload}));state.audit.push(entry);await idbPut('audit',entry);}

let bcEstate,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcEstate=new BroadcastChannel('fall-estate');bcEstate.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.clients))for(const c of p.clients){if(!state.clients.find(x=>x.id===c.id)){state.clients.push(c);await idbPut('clients',c);}}if(p.firm&&!state.firm){state.firm=p.firm;await idbPut('firms',p.firm);}render();}});bcEstate.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

// Template engine
function buildContext(){
  const f=state.firm||{};const cl=state.ui.selectedClient?state.clients.find(c=>c.id===state.ui.selectedClient):null;
  const map={'firm.name':f.name||'','firm.address':f.address||'','firm.email':f.email||'','firm.phone':f.phone||'','firm.hmrcAmlRef':f.hmrcAmlRef||'','firm.cmpScheme':f.cmpScheme||'','firm.redressScheme':f.redressScheme||''};
  if(cl){map['client.name']=((cl.title||'')+' '+(cl.firstName||'')+' '+(cl.lastName||'')).trim();map['client.address']=cl.address||'';map['client.email']=cl.email||'';map['client.phone']=cl.phone||'';
    map['property.address']=cl.propertyAddress||cl.address||'';map['property.rent']=cl.rent||'';map['property.price']=cl.annualIncome||'';}
  const extra=(state.ui.extraContext||'').split('\n');for(const line of extra){const eq=line.indexOf('=');if(eq>0){const k='ctx.'+line.slice(0,eq).trim();map[k]=line.slice(eq+1).trim();}}
  return map;
}
function resolveText(text,ctx){return text.replace(/\{\{([^}]+)\}\}/g,(_,key)=>{const v=ctx[key.trim()];return v!=null&&v!==''?String(v):`<span class="placeholder-empty">{{${key.trim()}}}</span>`;});}
function renderPaper(tpl,ctx,sections){
  const rendered=sections.map(s=>{const text=state.ui.editingSections?.[s.id]??s.text;const html=resolveText(text,ctx);if(s.locked)return `<div class="clause-locked">${markdownBasic(html)}</div>`;return markdownBasic(html);}).join('\n');
  return `<div class="doc-meta">${esc(tpl.name)} · ${esc(tpl.code)} · ${TOOLNAME} · ${dateStr(now())}</div>\n${rendered}`;
}
function markdownBasic(md){return md.replace(/\*\*(.+?)\*\*/g,'<strong>TBA</strong>').replace(/\n\n/g,'</p><p>').replace(/\n(\d+\.\s)/g,'<br>TBA').replace(/\n-\s/g,'<br>• ').replace(/\[SIGNATURE_BLOCK\]/g,'<div class="sig-block"><div><div class="sig-line"></div>Signed (Party 1)</div><div><div class="sig-line"></div>Signed (Party 2)</div></div>').replace(/^/,'<p>').replace(/$/,'</p>');}

async function saveDocument(status){
  const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);if(!tpl){toast('No template');return;}
  const ctx=buildContext();const content=renderPaper(tpl,ctx,tpl.sections);const hash=await sha256(content);
  const doc={id:uid('doc'),templateId:tpl.id,templateName:tpl.name,code:tpl.code,clientId:state.ui.selectedClient||'',status,content,hash:hash.slice(0,16),createdAt:now(),updatedAt:now(),sections:{...state.ui.editingSections},extraContext:state.ui.extraContext||''};
  state.documents.push(doc);await idbPut('documents',doc);
  await auditLog('document.'+status,{reasoning:tpl.name,payload:{docId:doc.id,hash:doc.hash}});
  toast(status==='issued'?'Document issued':'Draft saved');persistUI();render();
}

const T0_QA=[
  {q:/ast|shorthold|tenancy agreement/i,a:'An AST (Assured Shorthold Tenancy) is the default tenancy type in England under the Housing Act 1988. The agreement must include: parties, property address, rent amount and frequency, deposit amount and scheme, term dates, tenant and landlord obligations. Statutory requirements: gas safety cert, EPC (E+), EICR, How to Rent guide, deposit protection + prescribed info within 30 days.'},
  {q:/s(ection)?.?21|form 6a|no.?fault/i,a:'Section 21 notice (Form 6A) requires possession with at least 2 months\' notice. Pre-requisites: deposit protected + prescribed info served, gas safety cert, EPC, EICR, and How to Rent guide provided. Cannot serve during first 4 months of the first tenancy. Valid for 6 months. Deregulation Act 2015 restrictions apply if improvement notice outstanding.'},
  {q:/s(ection)?.?8|grounds|possession/i,a:'Section 8 notice specifies grounds for possession (Schedule 2, Housing Act 1988). Mandatory grounds (court must grant): Ground 8 (2+ months rent arrears). Discretionary grounds: Ground 10 (some rent arrears), Ground 11 (persistent delay), Ground 12 (breach of obligation), Ground 14 (nuisance). Notice periods vary by ground: 2 weeks to 2 months.'},
  {q:/deposit|protect|prescribed/i,a:'Housing Act 2004: tenancy deposits must be protected in DPS, MyDeposits, or TDS within 30 days. Prescribed information (SI 2007/797) must be served within 30 days. Failure: 1-3x deposit penalty, cannot serve valid s.21. Deposit capped at 5 weeks\' rent for ASTs where annual rent <TBAk (Tenant Fees Act 2019).'},
  {q:/sole.?agency|multi.?agency|ea.?1979/i,a:'Estate Agents Act 1979 s.18 requires agents to explain the effect of the agency terms. Sole agency: commission payable if ANY agent sells (but not if vendor sells privately). Sole selling rights: commission payable even if vendor sells privately. Multi-agency: commission only to introducing agent. The EA 1979 wording must be included in the agreement.'},
  {q:/s(ection)?.?13|rent increase/i,a:'Section 13 notice proposes new rent for periodic tenancies. Must give 1 month notice (monthly tenancy) or 6 months (yearly). Cannot take effect in first year or within 1 year of last s.13 increase. Tenant can refer to First-tier Tribunal, which sets a market rent (which may be higher than proposed).'},
  {q:/inventory|check.?in|condition/i,a:'A detailed inventory at check-in is essential for deposit disputes. Record condition of every room: walls, floors, ceilings, fixtures, appliances. Include meter readings, key counts, and alarm codes. Photograph everything. Both parties should sign. At check-out, compare against the inventory. Evidence is critical for ADR claims.'},
  {q:/memo|memorandum.?of.?sale/i,a:'Memorandum of Sale confirms agreed sale terms and is sent to both solicitors. Not legally binding — sale is subject to contract until exchange. Should include: property address, agreed price, vendor and buyer details, both solicitors\' details, tenure, chain position, target dates. Agent issues this as soon as an offer is accepted.'}];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK property law rules'};}return null;}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK property law expert for estate and letting agents. Answer concisely.\n\n'+q}]})});if(!res.ok)return null;const json=await res.json();return {answer:json.content?.[0]?.text,source:'T3 · Anthropic'};}catch(e){return null;}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask…" onkeydown="if(event.key==='Enter')askQuestion()"><button class="btn brass" onclick="askQuestion()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight;}
async function askQuestion(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key in Settings.',source:'system'});persistUI();render();}

// Modal
function openModal(type){const modal=$('#modal');const title=$('#modalTitle');const body=$('#modalBody');modal.classList.add('open');
  if(type==='settings'){title.textContent='Settings';body.innerHTML=`<div class="field"><label>Anthropic key (T3)</label><input type="password" id="sAnthro" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`;}
}
function closeModal(){$('#modal').classList.remove('open');}
function saveSettings(){state.settings.anthropicKey=$('#sAnthro').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';persistUI();closeModal();toast('Saved');render();}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,clients:state.clients,documents:state.documents};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallestatepaper-export.json';a.click();URL.revokeObjectURL(u);toast('Exported');}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm);}for(const k of['clients','documents']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r);}}persistUI();toast('Imported');render();}catch(e){toast('Failed');}};inp.click();}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['firms','clients','documents','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r;});}location.reload();}

// Demo
async function seedDemo(){if(state.clients.length||state.firm)return;
  const firm={id:uid('firm'),name:'Demo Estates & Lettings',address:'5 High Street, London SW1A 2AA',email:'info@demoestates.co.uk',phone:'020 7456 7890',hmrcAmlRef:'XMLR00012345',cmpScheme:'DPS',redressScheme:'PRS',updatedAt:now(),isDemo:true};
  state.firm=firm;await idbPut('firms',firm);
  const t={id:uid('cl'),clientType:'tenant',title:'Ms',firstName:'Emma',lastName:'Clarke',address:'18 Oak Road, London',postcode:'SE1 4QR',propertyAddress:'Flat 3, 22 Elm Street, London SE1 5AB',rent:1400,email:'emma.clarke@email.co.uk',phone:'07700 900789',ts:now(),updatedAt:now(),isDemo:true};
  const b={id:uid('cl'),clientType:'buyer',title:'Mr',firstName:'Richard',lastName:'Osei',address:'12 Maple Ave, London',postcode:'N1 2XY',propertyAddress:'',email:'r.osei@email.co.uk',phone:'07700 900456',ts:now(),updatedAt:now(),isDemo:true};
  state.clients.push(t,b);await idbPut('clients',t);await idbPut('clients',b);
  await auditLog('demo.seeded',{reasoning:'first boot'});await persistUI();
}

(async function boot(){try{await openDB();await loadAll();await seedDemo();initMesh();$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';render();}catch(e){console.error('[fallestatepaper] boot error:',e);document.getElementById('view').innerHTML='<div class="empty"><h3>Boot error</h3><p>'+esc(e.message)+'</p></div>';}})();
</script>
